name: macOS Build and Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test CLI
        run: python3 -m unittest discover -s tests -v
      - name: Configure Developer ID certificate (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERT_BASE64" && test -n "$CERT_PASSWORD" && test -n "$KEYCHAIN_PASSWORD" || { echo 'Missing certificate secrets'; exit 1; }
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lub.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/lub.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lub.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/lub.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lub.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/lub.keychain-db"
          rm -f "$RUNNER_TEMP/developer-id.p12"
      - name: Build DMG for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./scripts/release.sh
      - name: Build signed and notarized DMG for release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LUB_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          LUB_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LUB_NOTARY_KEYCHAIN: ${{ runner.temp }}/lub.keychain-db
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          test -n "$LUB_SIGN_IDENTITY" && test -n "$LUB_TEAM_ID" && test -n "$APPLE_ID" && test -n "$APP_PASSWORD" || exit 1
          xcrun notarytool store-credentials lub-ci --apple-id "$APPLE_ID" --team-id "$LUB_TEAM_ID" --password "$APP_PASSWORD" --keychain "$RUNNER_TEMP/lub.keychain-db"
          LUB_NOTARY_PROFILE=lub-ci ./scripts/release.sh
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test -f "releases/Local-Update-Bridge-${GITHUB_REF_NAME}.dmg" || { echo 'Tag and app version differ'; exit 1; }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Local-Update-Bridge-macOS
          path: |
            releases/*.dmg
            releases/*.sha256
          if-no-files-found: error
      - name: Publish signed release DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/*.dmg releases/*.sha256 --generate-notes --verify-tag
